name: repo-guard

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: pre-commit --version
        run: pre-commit --version

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Install Git LFS
        shell: bash
        run: git lfs install

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - uses: Swatinem/rust-cache@v2.9.0

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: cargo build --release
        run: cargo build --release

      - name: cargo audit
        run: cargo audit

      - name: Validate pre-commit manifest
        run: pre-commit validate-manifest .pre-commit-hooks.yaml

  policy-example:
    name: Policy example (Ubuntu)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - name: Install Git LFS
        run: git lfs install
      - name: Build release binary
        run: cargo build --release
      - name: Install locally
        run: cargo install --path . --locked --force
      - name: History range check (PR)
        if: github.event_name == 'pull_request'
        run: repo-guard history check --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" --format json
